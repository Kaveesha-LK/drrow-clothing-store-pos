# =====================================================================
# D’RROW Clothing Store POS - Database Configuration
# Supported types: mysql, mariadb, embedded
# =====================================================================
db.type=mysql
db.host=localhost
db.port=3306
db.name=drrow_pos
db.user=root
db.password=
db.useSSL=false
db.serverTimezone=UTC
db.allowPublicKeyRetrieval=true
db.autoReconnect=true
db.characterEncoding=UTF-8

# Connection Pool Settings
db.pool.initialSize=5
db.pool.maxActive=20
db.pool.maxIdle=10
db.pool.minIdle=2
db.pool.maxWaitMillis=15000
